<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ouvidoria</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <div class="cabecalho">
        <h1>Ouvidoria Dev Academy</h1>
    </div>
    <div class="estilo-form">
        <form action="" method="get">
            <fieldset>
                <label for="email">Digite e-mai</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                <br>
                <textarea name="reclamacao" id="reclamacao" cols="20" rows="10">Digite aqui sua reclamação</textarea>
                <br>
                <button type="submit" class="btn-enviar">Enviar</button>
                <button type="reset" class="btn-clean">Limpar</button>
            </fieldset>
            <a href="index.html" class="btn-voltar" target="_self">Voltar para a pagina inicial</a>
        </form>
    </div>

</body>

</html>
