<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Aluno</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="cabecalho">
        <h1>Bem vindo ao portal do aluno</h1>
        <p>Preencha seus dados para acessar sua conta:</p>
    </div>

    <div id="form">
        <div class="estilo-form">
            <form action="" method="post">
                <label for="usuario">Digite seu Login</label>
                <input type="email" id="usuario" name="login" placeholder="Digite seu e-mail"
                    required="Preenchimento Obrigatorio!">
                <label for="senha">Digite sua senha</label>
                <input type="password" id="senha" name="password" placeholder="Digite sua senha"
                    required="Preenchimento Obrigatorio!">
                <button type="submit" class="btn-enviar">Enviar</button>
            </form>
            <a href="index.html" class="btn-voltar" target="_self">Voltar para a pagina inicial</a>
        </div>
    </div>

</body>

</html>
