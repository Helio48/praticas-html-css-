<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de cursos</title>
    <link rel="stylesheet" href="../02-pagina-cursos/estilo.css">
</head>

<body>
    <h1>Pagina de cursos</h1>

    <table>

        <thead>
            <tr>
                <th class="coluna">Curso</th>
                <th class="coluna">Tecnologia</th>
                <th class="coluna">Status</th>
                <th class="coluna">Progresso</th>
            </tr>
        </thead>

        <tbody>
            <tr class="curso-destaque">
                <td class="curso">Curso de HTML</td>
                <td class="curso">Front-end</td>
                <td class="curso">Em andamento</td>
                <td class="curso">50%</td>
            </tr>

            <tr class="curso-destaque">
                <td class="curso">Curso de CSS</td>
                <td class="curso">Front-end</td>
                <td class="curso">Em andamento</td>
                <td class="curso">30%</td>
            </tr>

            <tr class="curso-destaque">
                <td class="curso">Curso de JavaScript</td>
                <td class="curso">Front-end</td>
                <td class="curso">Em andamento</td>
                <td class="curso">10%</td>
            </tr>
        </tbody>
    </table>
    <hr> <br>

    <h2>Materiais de estudo</h2>

    <ul>
        <li> <a href="/img/celular1.png">HTML</a></li>
        <li> <a href="/img/celular2.png">CSS</a></li>
        <li> <a href="/img/celular3.png">JavaScript</a></li>
    </ul>

</body>

</html>
